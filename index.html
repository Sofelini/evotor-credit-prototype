<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Кликабельный прототип пилота «Кредит для бизнеса» в приложении Эвотор">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>Кредит для бизнеса в Эвоторе</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: шапка с переключателем сценариев · слева список шагов · по центру телефон · справа пояснение к шагу */
:root{
  --bg:#ECEEF2; --panel:#FFFFFF; --fg:#16171B; --muted:#5D626D; --line:#D8DBE2;
  --accent:#F26511; --accent-ink:#FFFFFF; --accent-soft:#FDE9DC; --bezel:#0D0E10;
  --font:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --panel:#1A1C20; --fg:#ECEEF2; --muted:#9BA1AC; --line:#2B2E34;
  --accent:#FF7A2E; --accent-ink:#1A0C03; --accent-soft:#3A2214; --bezel:#000000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111215; --panel:#1A1C20; --fg:#ECEEF2; --muted:#9BA1AC; --line:#2B2E34;
  --accent:#FF7A2E; --accent-ink:#1A0C03; --accent-soft:#3A2214; --bezel:#000000; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
.shell{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:16px 12px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;font-weight:700;margin:0;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--fg);padding:8px 14px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible,.navb:focus-visible,.steps button:focus-visible,.hintbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.hintbtn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 12px;border-radius:10px;cursor:pointer}
.hintbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

main.stage{flex:1;display:grid;grid-template-columns:minmax(200px,260px) auto minmax(220px,320px);gap:28px;justify-content:center;align-items:start;padding-block:20px 28px}
.steps{min-width:0}
.steps h2,.notes .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{width:100%;display:flex;gap:10px;align-items:baseline;text-align:left;font:inherit;font-size:14px;border:0;background:transparent;color:var(--fg);padding:7px 10px;border-radius:9px;cursor:pointer}
.steps button .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:26px}
.steps button:hover{background:var(--panel)}
.steps button[aria-current="step"]{background:var(--accent-soft);font-weight:600}
.steps button[aria-current="step"] .n{color:var(--accent)}
.steps .phase{font-size:11px;color:var(--muted);margin:12px 10px 4px;letter-spacing:.04em}

.devwrap{position:relative}
.device{width:414px;height:868px;transform-origin:top left;background:var(--bezel);border-radius:56px;padding:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.notes{min-width:0;display:flex;flex-direction:column;gap:12px}
.notes .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.notes h3{font-size:20px;margin:0 0 8px;text-wrap:balance;line-height:1.25}
.notes p{margin:0;color:var(--muted)}
.notes .who{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--fg);margin-bottom:10px}
.navrow{display:flex;gap:8px}
.navb{flex:1;font:inherit;font-size:14px;font-weight:600;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.navb.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.navb:disabled{opacity:.4;cursor:default}
.tip{font-size:13px;color:var(--muted)}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}

@media (max-width:1060px){main.stage{grid-template-columns:auto minmax(220px,320px)}.steps{display:none}}
@media (max-width:720px){main.stage{grid-template-columns:1fr;justify-items:center}.notes{width:100%;max-width:440px}}

/* ---------- Телефон: фиксированный облик приложения Эвотор ---------- */
.ph{--a-bg:#F2F3F5;--a-sf:#FFFFFF;--a-tx:#1C1C1E;--a-tx2:#6E6E76;--a-tx3:#A1A1A8;--a-bd:#E2E3E8;
  --a-ac:#FF6A13;--a-acs:#FFF0E6;--a-ok:#1FA968;--a-oks:#E6F6EE;--a-wr:#E8920C;--a-wrs:#FFF5E1;--a-er:#E5484D;--a-ers:#FDECEC;
  --a-in:#2F6BFF;--a-ins:#EAF1FF;--a-dk:#18181A;--a-dks:#2C2B2E;--a-w:#FFFFFF;
  width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--a-bg);color:var(--a-tx);
  display:flex;flex-direction:column;font-family:var(--font);font-size:15px;line-height:1.35}
.ph *{box-sizing:border-box}
.ph.dark{background:var(--a-dk);color:var(--a-w)}
.ph.lock{background:linear-gradient(170deg,#2B2F45,#15171F);color:var(--a-w)}
.ph.call{background:#16161A;color:var(--a-w)}
.ph.white{background:var(--a-sf)}
.sb{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 48px;font-weight:600;font-size:16px}
.sb svg{height:13px;width:auto}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px}
.foot{flex:none;padding:10px 16px 6px;display:flex;flex-direction:column;gap:8px}
.home{flex:none;height:30px;display:flex;justify-content:center;align-items:center}
.home i{width:134px;height:5px;border-radius:3px;background:currentColor;opacity:.9}
.ph.dark .home,.ph.lock .home,.ph.call .home{color:var(--a-w)}
.nb{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.nb b{font-size:17px;font-weight:600}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:inherit;cursor:pointer;padding:0}
.ib svg{width:24px;height:24px}
.wb{flex:none;display:flex;align-items:center;gap:8px;padding:4px 6px 8px 16px;background:var(--a-sf);border-bottom:1px solid var(--a-bd)}
.wb .t{flex:1;min-width:0}
.wb .t b{display:block;font-size:15px;font-weight:600}
.wb .t span{font-size:12px;color:var(--a-tx2);display:flex;gap:4px;align-items:center}
.wb .t span svg{width:11px;height:11px}
.h1{font-size:28px;font-weight:700;line-height:1.15;margin:0}
.h2{font-size:22px;font-weight:700;margin:6px 0 0}
.lead{color:var(--a-tx2);margin:0}
.small{font-size:13px;color:var(--a-tx2)}
.tiny{font-size:12px;color:var(--a-tx3);text-align:center}
.btn{width:100%;height:52px;border-radius:14px;border:0;font:inherit;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--a-ac);color:var(--a-w)}
.btn.s{background:var(--a-acs);color:var(--a-ac)}
.btn.g{background:var(--a-sf);color:var(--a-tx)}
.btn.t{background:transparent;color:var(--a-tx)}
.btn.d{background:var(--a-bd);color:var(--a-tx3);cursor:default}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:500;color:var(--a-tx2)}
.fld .box{height:52px;border-radius:12px;background:var(--a-sf);border:1px solid var(--a-bd);display:flex;align-items:center;padding:0 16px;font-size:17px}
.fld .box.big{font-size:22px;font-weight:600}
.fld .hl{font-size:12px;color:var(--a-tx2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--a-bd);background:var(--a-sf);color:var(--a-tx);border-radius:18px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{border:1.5px solid var(--a-ac);background:var(--a-acs);color:var(--a-ac);font-weight:600}
.card{background:var(--a-sf);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ph.dark .card{background:var(--a-dks)}
.row{display:flex;align-items:center;gap:12px}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.bdg{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.bdg svg{width:22px;height:22px}
.bdg.sm{width:32px;height:32px;border-radius:10px}.bdg.sm svg{width:18px;height:18px}
.bdg.lg{width:72px;height:72px;border-radius:24px}.bdg.lg svg{width:38px;height:38px}
.c-ac{background:var(--a-acs);color:var(--a-ac)} .c-ok{background:var(--a-oks);color:var(--a-ok)} .c-wr{background:var(--a-wrs);color:var(--a-wr)}
.c-in{background:var(--a-ins);color:var(--a-in)} .c-er{background:var(--a-ers);color:var(--a-er)} .c-n{background:var(--a-bg);color:var(--a-tx)}
.c-okf{background:var(--a-ok);color:var(--a-w)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t1{font-weight:600;font-size:16px}
.t2{font-size:13px;color:var(--a-tx2)}
.list>*+*{border-top:1px solid var(--a-bd)}
.list{padding:0;gap:0}
.list .li{padding:13px 16px}
.chev{width:20px;height:20px;color:var(--a-tx3);flex:none}
.opt{cursor:pointer;border:1.5px solid transparent}
.opt.rec{border-color:var(--a-ac)}
.todo{outline:1.5px dashed currentColor;outline-offset:3px;border-radius:4px;position:relative}
.todo::after{content:"текст в работе";position:absolute;right:0;top:-18px;font-size:10px;font-weight:600;letter-spacing:.04em;opacity:.8}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--a-sf);border-radius:24px 24px 0 0;padding:10px 20px 34px;z-index:6;display:flex;flex-direction:column;gap:14px;align-items:center;color:var(--a-tx)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--a-bd)}
.otp{display:flex;gap:8px}
.otp span{width:52px;height:60px;border-radius:12px;background:var(--a-bg);display:grid;place-items:center;font-size:24px;font-weight:600;cursor:pointer}
.otp span.cur{border:2px solid var(--a-ac)}
.push{position:absolute;left:12px;right:12px;top:48px;z-index:7;background:rgba(246,246,248,.97);color:var(--a-tx);border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.push .lg{flex:none;width:38px;height:38px;border-radius:9px;background:var(--a-ac);color:var(--a-w);display:grid;place-items:center;font-weight:700;font-size:18px}
.tab{display:flex;justify-content:space-between;align-items:center;background:var(--a-dks);border-radius:32px;padding:8px 10px}
.tab div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--a-w);padding:0 4px}
.tab svg{width:22px;height:22px;color:var(--a-tx3)}
.tab .on,.tab .on svg{color:#4CD38E}
.metric{flex:1;background:var(--a-dks);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.metric b{font-size:22px;font-weight:600}
.banner{background:var(--a-ac);color:var(--a-w);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.banner .cta{align-self:flex-start;background:var(--a-w);color:var(--a-ac);font-weight:600;border-radius:12px;padding:12px 20px}
.mitem{display:flex;align-items:center;gap:22px;padding:10px 4px;font-size:20px}
.mitem svg{width:28px;height:28px}
.hr{height:1.5px;background:rgba(255,255,255,.25);margin:6px 0}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 4px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.ex{flex:none;width:282px;scroll-snap-align:start;background:var(--a-sf);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.ex .hd{height:96px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.ex .hd .ic{width:56px;height:56px;border-radius:18px;background:var(--a-w);display:grid;place-items:center}
.ex .hd .ic svg{width:30px;height:30px}
.ex .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--a-bd)}
.dots i.on{width:18px;background:var(--a-ac)}
details{border-top:1px solid var(--a-bd)}
details:first-child{border-top:0}
summary{list-style:none;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;font-weight:500;cursor:pointer}
summary::-webkit-details-marker{display:none}
details p{margin:0;padding:0 16px 14px;color:var(--a-tx2);font-size:14px}
details[open] summary svg{transform:rotate(180deg)}
.msg{align-self:flex-start;max-width:290px;background:var(--a-bg);border-radius:18px;padding:10px 14px;font-size:15px}
.tog{width:51px;height:31px;border-radius:16px;background:var(--a-bd);position:relative;flex:none;cursor:pointer;border:0;padding:0}
.tog::after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:var(--a-w);top:2px;left:2px;transition:left .2s}
.tog.on{background:var(--a-ok)}.tog.on::after{left:22px}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:12px;color:var(--a-tx2)}
.offer .pp{display:flex;gap:8px}
.offer .pp div{flex:1;background:var(--a-bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.offer .pp span{font-size:12px;color:var(--a-tx2)}
.offer .pp b{font-size:15px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--a-ins);color:var(--a-in);display:grid;place-items:center;font-weight:700;flex:none}
.icsv{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ph [data-go],.ph [data-act]{cursor:pointer}
body.hint .ph [data-go]{animation:hint 1.4s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(255,106,19,0)}50%{box-shadow:0 0 0 4px rgba(255,106,19,.55)}}
@media (prefers-reduced-motion:reduce){body.hint .ph [data-go]{animation:none;outline:2px solid #FF6A13;outline-offset:2px}.tog::after{transition:none}}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div>
      <h1>Кредит для бизнеса в приложении Эвотор</h1>
      <div class="sub">Кликабельный прототип двух сценариев пилота</div>
    </div>
    <div class="seg" role="group" aria-label="Сценарий">
      <button type="button" id="segA" data-scen="a">A · Быстрый пилот</button>
      <button type="button" id="segB" data-scen="b">B · Нативное приложение</button>
    </div>
    <div class="spacer"></div>
    <button type="button" class="hintbtn" id="hintBtn" aria-pressed="false">Показать, куда нажимать</button>
  </header>

  <main class="stage">
    <nav class="steps" aria-label="Шаги сценария">
      <h2 id="stepsTitle">Шаги</h2>
      <ol id="stepList"></ol>
    </nav>
    <div class="devwrap" id="devwrap">
      <div class="device" id="device"><div class="ph" id="ph"></div></div>
    </div>
    <aside class="notes">
      <div class="card">
        <div class="eyebrow" id="stepNo">Шаг</div>
        <span class="who" id="stepWho"></span>
        <h3 id="stepTitle"></h3>
        <p id="stepNote"></p>
      </div>
      <div class="navrow">
        <button type="button" class="navb" id="prevBtn">← Назад</button>
        <button type="button" class="navb primary" id="nextBtn">Дальше →</button>
      </div>
      <p class="tip">Нажимайте на кнопки внутри телефона или листайте стрелками <kbd>←</kbd> <kbd>→</kbd>. Цифры, банки и условия на экранах условные.</p>
    </aside>
  </main>
</div>

<script>
(function(){
const ic=(d,extra)=>`<svg class="icsv" viewBox="0 0 24 24" aria-hidden="true"${extra||''}>${d}</svg>`;
const I={

 doc:ic('<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>'),

 chart:ic('<path d="M4 20h16M7 16v-4M12 16V7M17 16v-6"/>'),

 camera:ic('<path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),

 link:ic('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'),
 upload:ic('<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 15v4h14v-4"/>'),
 plus:ic('<path d="M12 5v14M5 12h14"/>'), info:ic('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>'),
 snow:ic('<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5"/>'),
 store:ic('<path d="M4 9l1.5-5h13L20 9M4 9h16M4 9v11h16V9M9 20v-6h6v6"/>'),
 fridge:ic('<rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M6 9h12M9 5.5v1.5M9 12v2.5"/>'),
 wallet:ic('<rect x="3.5" y="6" width="17" height="13" rx="2.5"/><path d="M3.5 10h17M16 14.5h.01"/>'),
 box:ic('<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5zM3.5 7.5L12 12l8.5-4.5M12 12v9"/>'),

  <div class="otp" data-go="b13">${['4','8','1','',''].map((d,i)=>`<span class="${i===3?'cur':''}">${d}</span>`).join('')}</div>
  <span class="tiny">Отправить код повторно через 0:45</span>
  <div class="card" style="background:var(--a-bg);width:100%;gap:12px;padding:14px">${['Заявка-анкета на кредит','Согласие на обработку персональных данных','Согласие на запрос кредитной истории в БКИ','Согласие на передачу данных банкам-партнёрам'].map(t=>`<div class="row top" style="gap:10px"><span style="flex:none;width:24px;height:24px;border-radius:7px;background:var(--a-ac);color:var(--a-w);display:grid;place-items:center"><span style="width:16px;height:16px">${I.check}</span></span><div class="grow"><div style="font-size:14px">${t}</div><span style="font-size:13px;color:var(--a-ac);font-weight:500">Читать документ</span></div></div>`).join('')}</div>
  <span class="tiny">Вводя код, вы подписываете документы простой электронной подписью.</span></div>`:''}`;}

const ORDER={a:['a1','a2','a3','a4','a5','a6','a7','a8'],b:['b1','b2','b3','b4','b5','b6','b7','b8','b9','b10','b11','b12','b13','b14','b15']};
const PHASES={a:{a1:'В приложении',a5:'Вне приложения'},b:{b1:'Заявка',b5:'Статус и дозаполнение',b13:'Ответ банков'}};
let cur='a1',hist=[];
const ph=document.getElementById('ph');

function go(id,push){if(!S[id])return;if(push!==false&&cur&&cur!==id)hist.push(cur);cur=id;
 try{if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+id);}catch(e){}
 render();}
function render(){const s=S[cur];const sc=cur[0];
 ph.className='ph '+(s.cls||'');ph.innerHTML=s.h();
 const sc_el=ph.querySelector('.scroll');if(sc_el)sc_el.scrollTop=0;
 const car=ph.querySelector('#car');if(car){car.addEventListener('scroll',()=>{const i=Math.round(car.scrollLeft/294);ph.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on',i===j));},{passive:true});}
 document.getElementById('segA').setAttribute('aria-pressed',sc==='a');document.getElementById('segB').setAttribute('aria-pressed',sc==='b');
 const order=ORDER[sc],idx=order.indexOf(cur);
 document.getElementById('stepNo').textContent=`Сценарий ${sc.toUpperCase()} · шаг ${idx+1} из ${order.length}`;
 document.getElementById('stepWho').textContent=s.who;
 document.getElementById('stepTitle').textContent=s.t;
 document.getElementById('stepNote').textContent=s.note;
 document.getElementById('prevBtn').disabled=idx===0;
 const nb=document.getElementById('nextBtn');
 if(idx===order.length-1){nb.textContent=sc==='a'?'Перейти к сценарию B →':'Начать заново';nb.dataset.target=sc==='a'?'b1':'a1';}else{nb.textContent='Дальше →';nb.dataset.target=order[idx+1];}
 document.getElementById('stepsTitle').textContent=sc==='a'?'Сценарий A · быстрый пилот':'Сценарий B · нативно';
 const ol=document.getElementById('stepList');ol.innerHTML='';
 order.forEach((id,i)=>{if(PHASES[sc][id]){const p=document.createElement('li');p.className='phase';p.textContent=PHASES[sc][id];ol.appendChild(p);}
  const li=document.createElement('li');const b=document.createElement('button');b.type='button';
  b.innerHTML=`<span class="n">${sc.toUpperCase()}${i+1}</span><span>${S[id].t}</span>`;if(id===cur)b.setAttribute('aria-current','step');
  b.onclick=()=>go(id);li.appendChild(b);ol.appendChild(li);});}

ph.addEventListener('click',e=>{
 const amt=e.target.closest('[data-amt]');if(amt){amount=amounts[amt.dataset.amt];ph.querySelectorAll('[data-amt]').forEach(c=>c.classList.toggle('on',c===amt));const box=ph.querySelector('#amtBox');if(box)box.textContent=amount;return;}
 const srt=e.target.closest('[data-sort]');if(srt){ph.querySelectorAll('[data-sort]').forEach(c=>c.classList.toggle('on',c===srt));return;}
 const act=e.target.closest('[data-act]');
 if(act){const a=act.dataset.act;
  if(a==='tog'){act.classList.toggle('on');return;}
  if(a==='upload'||a==='buh'){const st=ph.querySelector('#stState');if(st){st.textContent=a==='upload'?'2 файла загружены · проверяем':'Ссылка отправлена бухгалтеру';st.style.color='var(--a-ok)';}return;}
  if(a==='pick'){act.textContent='Менеджер свяжется для оформления';act.className='btn s';return;}
  if(a==='co-open'){const sh=ph.querySelector('#coSheet');sh.hidden=false;sh.innerHTML=`<div class="sheetbg" data-act="co-close"></div><div class="sheet" style="align-items:stretch"><span class="grab" style="align-self:center"></span><b style="font-size:20px">Для какой компании кредит?</b><div class="card list" style="background:var(--a-bg)">${companies.map((c,i)=>`<div class="li row" data-act="co-pick" data-i="${i}"><div class="grow"><div style="font-weight:500">${c[0]}</div><div class="t2">ИНН ${c[1]}</div></div>${c[1]===company[1]?`<span style="width:20px;height:20px;color:var(--a-ac)">${I.check}</span>`:''}</div>`).join('')}</div><span class="small">Показываем компании, привязанные к вашему аккаунту Эвотор.</span></div>`;return;}
  if(a==='co-pick'){company=companies[+act.dataset.i];ph.querySelector('#coName').textContent=company[0];ph.querySelector('#coInn').textContent=company[1];ph.querySelector('#coSheet').hidden=true;return;}
  if(a==='co-close'){ph.querySelector('#coSheet').hidden=true;return;}
 }
 if(e.target.closest('summary'))return;
 const b=e.target.closest('[data-back]');if(b){const p=hist.pop();if(p)go(p,false);else{const o=ORDER[cur[0]];const i=o.indexOf(cur);if(i>0)go(o[i-1],false);}return;}
 const g=e.target.closest('[data-go]');if(g&&g.dataset.go){go(g.dataset.go);}
});
document.getElementById('prevBtn').onclick=()=>{const o=ORDER[cur[0]];const i=o.indexOf(cur);if(i>0)go(o[i-1]);};
document.getElementById('nextBtn').onclick=e=>{const t=e.currentTarget.dataset.target;if(t[0]!==cur[0])hist=[];go(t);};
document.querySelectorAll('[data-scen]').forEach(b=>b.onclick=()=>{hist=[];go(b.dataset.scen+'1');});
document.getElementById('hintBtn').onclick=e=>{const on=document.body.classList.toggle('hint');e.currentTarget.setAttribute('aria-pressed',on);};
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
 if(e.key==='ArrowRight')document.getElementById('nextBtn').click();
 if(e.key==='ArrowLeft'&&!document.getElementById('prevBtn').disabled)document.getElementById('prevBtn').click();});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(S[h]&&h!==cur){hist=[];go(h,false);}});

function fit(){const dev=document.getElementById('device'),wrap=document.getElementById('devwrap');
 const narrow=window.innerWidth<=720;
 const availH=narrow?Infinity:window.innerHeight-(document.querySelector('header.top').offsetHeight+48);
 const availW=Math.min(window.innerWidth-32,narrow?window.innerWidth-32:9999);
 const s=Math.max(.45,Math.min(1,availH/868,availW/414));
 dev.style.transform=`scale(${s})`;wrap.style.width=(414*s)+'px';wrap.style.height=(868*s)+'px';}
window.addEventListener('resize',fit);
const h0=location.hash.slice(1);cur=S[h0]?h0:'a1';render();fit();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
</script>

</body>
